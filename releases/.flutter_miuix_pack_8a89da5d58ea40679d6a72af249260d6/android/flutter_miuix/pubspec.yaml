name: flutter_miuix
description: A localized, cross-platform Flutter implementation of MIUIX components for Android and Windows.
version: 1.0.9
homepage: https://github.com/local/flutter_miuix
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  libmonet: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.xinxin.flutter_miuix
        pluginClass: FlutterMiuixPlugin
  shaders:
    # Custom MIUIX blend modes (Lab, linear light, MI dodge/burn) cannot be
    # represented by Flutter's standard BlendMode enum. This runtime filter is
    # a direct port of miuix-blur/internal/Shaders.kt.
    - shaders/miuix_texture_blend.frag
  fonts:
    - family: MiuixIconsLight
      fonts:
        - asset: assets/fonts/MiuixIcons-Light.ttf
    - family: MiuixIconsNormal
      fonts:
        - asset: assets/fonts/MiuixIcons-Normal.ttf
    - family: MiuixIconsRegular
      fonts:
        - asset: assets/fonts/MiuixIcons-Regular.ttf
    - family: MiuixIconsMedium
      fonts:
        - asset: assets/fonts/MiuixIcons-Medium.ttf
    - family: MiuixIconsDemibold
      fonts:
        - asset: assets/fonts/MiuixIcons-Demibold.ttf
